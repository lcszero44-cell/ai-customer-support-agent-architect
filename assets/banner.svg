<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="NovaCare AI Agent — Prompt Engineering and Guardrail Architecture">
  <defs>
    <!-- Deep Cyber-Dark Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="50%" stop-color="#0a1229"/>
      <stop offset="100%" stop-color="#071a2b"/>
    </linearGradient>

    <!-- Ambient Glows -->
    <radialGradient id="glowCyan" cx="76%" cy="48%" r="36%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.26"/>
      <stop offset="55%" stop-color="#3b82f6" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#050816" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowEmerald" cx="18%" cy="22%" r="32%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#050816" stop-opacity="0"/>
    </radialGradient>

    <!-- Text Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#d8f8ff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Isometric Face Gradients -->
    <!-- Layer 1 (Base LGPD Shield) -->
    <linearGradient id="isoTop1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#065f46" stop-opacity="0.72"/>
    </linearGradient>
    <linearGradient id="isoLeft1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="isoRight1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>

    <!-- Layer 2 (Middle Guardrails Engine) -->
    <linearGradient id="isoTop2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.58"/>
      <stop offset="100%" stop-color="#312e81" stop-opacity="0.86"/>
    </linearGradient>
    <linearGradient id="isoLeft2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="isoRight2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Layer 3 (Top AI Core Cube) -->
    <linearGradient id="isoTop3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="isoLeft3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
    <linearGradient id="isoRight3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>

    <!-- Subtle Cyber Grid Pattern -->
    <pattern id="isoGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#38bdf8" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>

    <!-- Soft Neon Shadow -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Card -->
  <rect x="0" y="0" width="1200" height="380" rx="18" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="1200" height="380" rx="18" fill="url(#isoGrid)"/>
  <rect x="0" y="0" width="1200" height="380" rx="18" fill="url(#glowCyan)"/>
  <rect x="0" y="0" width="1200" height="380" rx="18" fill="url(#glowEmerald)"/>

  <!-- Subtle Outer Border -->
  <rect x="1.5" y="1.5" width="1197" height="377" rx="17" fill="none" stroke="#38bdf8" stroke-opacity="0.28" stroke-width="1.5"/>

  <!-- Decorative Circuit Lines -->
  <g stroke="#00f0ff" stroke-opacity="0.22" stroke-width="1.2" fill="none">
    <path d="M 55 342 L 240 342 L 265 318 L 620 318"/>
    <path d="M 720 64 L 840 64 L 860 84"/>
    <path d="M 1065 292 L 1145 292 L 1165 272"/>
  </g>
  <circle cx="620" cy="318" r="3.5" fill="#00f0ff" filter="url(#neonGlow)"/>
  <circle cx="720" cy="64" r="3" fill="#10b981"/>
  <circle cx="1165" cy="272" r="3" fill="#a855f7"/>

  <!-- LEFT COLUMN: Typography & Telemetry -->
  <g font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, Roboto, sans-serif">
    <!-- Top Eyebrow Pill -->
    <rect x="56" y="48" width="380" height="28" rx="14" fill="#0f172a" stroke="#10b981" stroke-opacity="0.65" stroke-width="1"/>
    <circle cx="74" cy="62" r="4.5" fill="#10b981" filter="url(#neonGlow)"/>
    <text x="88" y="66.5" fill="#a7f3d0" font-size="11.5" font-weight="700" letter-spacing="1.6">NOVACARE CLÍNICA  •  AGENTE CLARA (WHATSAPP)</text>

    <!-- Hero Title -->
    <text x="56" y="138" fill="url(#titleGrad)" font-size="52" font-weight="800" letter-spacing="1.5">NOVACARE AI AGENT</text>

    <!-- Architectural Subtitle -->
    <text x="56" y="176" fill="#38bdf8" font-size="18.5" font-weight="700" letter-spacing="2.4">PROMPT ENGINEERING // GUARDRAIL ARCHITECTURE</text>

    <!-- Description Line -->
    <text x="56" y="216" fill="#cbd5e1" font-size="15" font-weight="400">
      Arquitetura de Produção em 3 Passos • Defesa Anti-Alucinação • Compliance LGPD • Handoff Clínico
    </text>

    <!-- Feature Telemetry Chips -->
    <g transform="translate(56, 246)">
      <rect x="0" y="0" width="152" height="32" rx="8" fill="#0b1528" stroke="#22d3ee" stroke-opacity="0.45"/>
      <text x="76" y="20.5" text-anchor="middle" fill="#67e8f9" font-size="11.5" font-weight="700" letter-spacing="0.8">ANTI-HALLUCINATION</text>

      <rect x="164" y="0" width="128" height="32" rx="8" fill="#0b1528" stroke="#10b981" stroke-opacity="0.5"/>
      <text x="228" y="20.5" text-anchor="middle" fill="#6ee7b7" font-size="11.5" font-weight="700" letter-spacing="0.8">LGPD ZERO-LEAK</text>

      <rect x="304" y="0" width="118" height="32" rx="8" fill="#0b1528" stroke="#818cf8" stroke-opacity="0.5"/>
      <text x="363" y="20.5" text-anchor="middle" fill="#c7d2fe" font-size="11.5" font-weight="700" letter-spacing="0.8">MAX 5 LINES</text>

      <rect x="434" y="0" width="154" height="32" rx="8" fill="#0b1528" stroke="#c084fc" stroke-opacity="0.5"/>
      <text x="511" y="20.5" text-anchor="middle" fill="#e9d5ff" font-size="11.5" font-weight="700" letter-spacing="0.8">6/6 STRESS AUDITED</text>
    </g>

    <!-- Footer Metadata -->
    <text x="56" y="328" fill="#64748b" font-size="12" font-weight="600" letter-spacing="1.2">
      BOOTCAMP BRADESCO — AGENTES DE IA DO ZERO À PRÁTICA (DIO)  |  PYTHON 3 VERIFIED
    </text>
  </g>

  <!-- RIGHT COLUMN: 3D ISOMETRIC COGNITIVE STACK -->
  <g transform="translate(905, 195)">
    <!-- Isometric Ground Shadow -->
    <polygon points="0,128 165,48 0,-32 -165,48" fill="#000000" fill-opacity="0.45"/>

    <!-- LAYER 1 (BOTTOM): LGPD & PRIVACY SHIELD SLAB -->
    <g transform="translate(0, 62)">
      <!-- Left Face -->
      <polygon points="-145,0 0,70 0,94 -145,24" fill="url(#isoLeft1)" stroke="#10b981" stroke-opacity="0.55" stroke-width="1"/>
      <!-- Right Face -->
      <polygon points="145,0 0,70 0,94 145,24" fill="url(#isoRight1)" stroke="#34d399" stroke-opacity="0.65" stroke-width="1"/>
      <!-- Top Face -->
      <polygon points="0,-70 145,0 0,70 -145,0" fill="url(#isoTop1)" stroke="#34d399" stroke-opacity="0.9" stroke-width="1.4"/>
      <!-- Inner Isometric Trace -->
      <polygon points="0,-52 108,0 0,52 -108,0" fill="none" stroke="#6ee7b7" stroke-opacity="0.45" stroke-dasharray="5,4"/>
    </g>

    <!-- Vertical Data Bus Connectors (Layer 1 -> Layer 2) -->
    <g stroke="#22d3ee" stroke-width="1.6" stroke-opacity="0.65" stroke-dasharray="3,3">
      <line x1="-68" y1="36" x2="-68" y2="-4"/>
      <line x1="68" y1="36" x2="68" y2="-4"/>
      <line x1="0" y1="68" x2="0" y2="28"/>
    </g>

    <!-- LAYER 2 (MIDDLE): GUARDRAILS & HANDOFF ROUTER SLAB -->
    <g transform="translate(0, -2)">
      <!-- Left Face -->
      <polygon points="-122,0 0,58 0,80 -122,22" fill="url(#isoLeft2)" stroke="#818cf8" stroke-opacity="0.65" stroke-width="1"/>
      <!-- Right Face -->
      <polygon points="122,0 0,58 0,80 122,22" fill="url(#isoRight2)" stroke="#a5b4fc" stroke-opacity="0.7" stroke-width="1"/>
      <!-- Top Face -->
      <polygon points="0,-58 122,0 0,58 -122,0" fill="url(#isoTop2)" stroke="#818cf8" stroke-opacity="0.95" stroke-width="1.4"/>
      <!-- Inner Circuit Diamond -->
      <polygon points="0,-38 80,0 0,38 -80,0" fill="none" stroke="#c7d2fe" stroke-opacity="0.55" stroke-width="1.2"/>
    </g>

    <!-- Vertical Data Bus Connectors (Layer 2 -> Layer 3) -->
    <g stroke="#38bdf8" stroke-width="1.8" stroke-opacity="0.85">
      <line x1="-42" y1="-26" x2="-42" y2="-56"/>
      <line x1="42" y1="-26" x2="42" y2="-56"/>
      <line x1="0" y1="-6" x2="0" y2="-36"/>
    </g>

    <!-- LAYER 3 (TOP): FLOATING AI AGENT CORE CUBE (CLARA) -->
    <g transform="translate(0, -82)" filter="url(#neonGlow)">
      <!-- Left Face -->
      <polygon points="-64,0 0,32 0,84 -64,52" fill="url(#isoLeft3)" stroke="#67e8f9" stroke-width="1.2"/>
      <!-- Right Face -->
      <polygon points="64,0 0,32 0,84 64,52" fill="url(#isoRight3)" stroke="#a5f3fc" stroke-width="1.2"/>
      <!-- Top Face -->
      <polygon points="0,-32 64,0 0,32 -64,0" fill="url(#isoTop3)" stroke="#e0f2fe" stroke-width="1.5"/>

      <!-- Medical Cross / AI Core Glyph on Top Face -->
      <polygon points="0,-16 14,-9 0,-2 -14,-9" fill="#ffffff" fill-opacity="0.92"/>
      <polygon points="0,2 14,9 0,16 -14,9" fill="#ffffff" fill-opacity="0.92"/>
      <polygon points="-18,-7 -4,0 -18,7 -32,0" fill="#ffffff" fill-opacity="0.92"/>
      <polygon points="18,-7 32,0 18,7 4,0" fill="#ffffff" fill-opacity="0.92"/>
      <polygon points="0,-7 14,0 0,7 -14,0" fill="#0f172a"/>
    </g>

    <!-- Floating Orbital Nodes & Labels -->
    <g font-family="'Segoe UI', Inter, sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.9">
      <!-- Right Callout 1: Core -->
      <line x1="68" y1="-78" x2="120" y2="-98" stroke="#22d3ee" stroke-width="1.2"/>
      <circle cx="120" cy="-98" r="3" fill="#22d3ee"/>
      <text x="128" y="-94" fill="#67e8f9">CLARA CORE</text>

      <!-- Right Callout 2: Guardrails -->
      <line x1="115" y1="-10" x2="152" y2="-10" stroke="#818cf8" stroke-width="1.2"/>
      <circle cx="152" cy="-10" r="3" fill="#818cf8"/>
      <text x="160" y="-6" fill="#c7d2fe">GUARDRAILS</text>

      <!-- Right Callout 3: LGPD -->
      <line x1="138" y1="68" x2="165" y2="68" stroke="#10b981" stroke-width="1.2"/>
      <circle cx="165" cy="68" r="3" fill="#10b981"/>
      <text x="173" y="72" fill="#6ee7b7">LGPD SHIELD</text>
    </g>
  </g>
</svg>
